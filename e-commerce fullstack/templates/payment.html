{% extends "base.html" %}
{% block title %}Payment - Flipkart{% endblock %}

{% block content %}
<div style="max-width:800px;margin:30px auto;padding:0 20px;display:flex;gap:20px;flex-wrap:wrap;">
    <!-- Order Summary -->
    <div style="flex:1;min-width:260px;background:white;padding:20px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.08);height:fit-content;">
        <h3 style="margin:0 0 16px;font-size:16px;">Order Summary</h3>
        <div id="orderItems" style="font-size:13px;color:#555;margin-bottom:12px;">Loading...</div>
        <hr style="border:none;border-top:1px solid #eee;">
        <div style="display:flex;justify-content:space-between;font-weight:bold;margin-top:12px;font-size:16px;">
            <span>Total</span><span id="orderTotal">₹0</span>
        </div>
    </div>

    <!-- Payment Form -->
    <div class="payment-container" style="flex:1;min-width:260px;">
        <h2 style="text-align:center;margin-bottom:20px;">Select Payment Method</h2>

        <label for="paymentMethod">Payment Method:</label>
        <select id="paymentMethod" onchange="toggleCardFields()">
            <option value="" disabled selected>Select Payment Method</option>
            <option value="cod">Cash on Delivery</option>
            <option value="card">Card Payment</option>
            <option value="upi">UPI</option>
        </select>

        <div id="cardFields" style="display:none;margin-top:12px;">
            <label>Card Number:</label>
            <input type="text" id="cardNumber" placeholder="16-digit card number" maxlength="16" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:10px;box-sizing:border-box;">
            <div style="display:flex;gap:10px;">
                <div style="flex:1;">
                    <label>Expiry Date:</label>
                    <input type="month" id="expiry" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box;">
                </div>
                <div style="flex:1;">
                    <label>CVV:</label>
                    <input type="password" id="cvv" placeholder="3-digit CVV" maxlength="3" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box;">
                </div>
            </div>
        </div>

        <div id="upiField" style="display:none;margin-top:12px;">
            <label>UPI ID:</label>
            <input type="text" id="upiId" placeholder="yourname@upi" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box;">
        </div>

        <button onclick="submitPayment()" style="width:100%;padding:14px;background:#2874f0;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:20px;">
            Pay Now 🔒
        </button>
    </div>
</div>

<!-- Success Modal -->
<div id="successModal" style="display:none;position:fixed;z-index:1000;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;">
    <div style="background:white;padding:40px;border-radius:16px;text-align:center;max-width:400px;animation:zoomIn 0.3s ease;">
        <div style="font-size:60px;margin-bottom:16px;">🎉</div>
        <h2 style="color:#4caf50;margin-bottom:8px;">Order Placed Successfully!</h2>
        <p style="color:#666;margin-bottom:4px;">Order ID: <strong id="orderId"></strong></p>
        <p style="color:#666;margin-bottom:20px;">Amount: <strong id="orderAmount"></strong></p>
        <p style="font-size:13px;color:#999;margin-bottom:20px;">Thank you for shopping with Flipkart!</p>
        <div style="display:flex;gap:10px;justify-content:center;">
            <button onclick="window.location.href='/orders'" style="background:#2874f0;color:white;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;">View Orders</button>
            <button onclick="window.location.href='/categories'" style="background:#4caf50;color:white;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;">Continue Shopping</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadOrderSummary() {
    const res = await fetch('/api/cart');
    if (res.status === 401) { window.location.href = '/login'; return; }
    const data = await res.json();
    const items = data.items || [];
    if (items.length === 0) { window.location.href = '/cart'; return; }
    document.getElementById('orderItems').innerHTML = items.map(i =>
        `<div style="display:flex;justify-content:space-between;margin-bottom:6px;">
            <span>${i.name} × ${i.quantity}</span>
            <span>₹${(Number(i.price) * i.quantity).toLocaleString('en-IN')}</span>
        </div>`
    ).join('');
    document.getElementById('orderTotal').textContent = `₹${data.total.toLocaleString('en-IN')}`;
}

function toggleCardFields() {
    const method = document.getElementById('paymentMethod').value;
    document.getElementById('cardFields').style.display = method === 'card' ? 'block' : 'none';
    document.getElementById('upiField').style.display = method === 'upi' ? 'block' : 'none';
}

async function submitPayment() {
    const method = document.getElementById('paymentMethod').value;
    if (!method) { showToast('Please select a payment method'); return; }

    if (method === 'card') {
        const card = document.getElementById('cardNumber').value.trim();
        const cvv = document.getElementById('cvv').value.trim();
        if (!/^\d{16}$/.test(card)) { showToast('Enter a valid 16-digit card number'); return; }
        if (!/^\d{3}$/.test(cvv)) { showToast('Enter a valid 3-digit CVV'); return; }
    }
    if (method === 'upi') {
        const upi = document.getElementById('upiId').value.trim();
        if (!upi.includes('@')) { showToast('Enter a valid UPI ID'); return; }
    }

    const res = await fetch('/api/orders/place', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({payment_method: method}) });
    const data = await res.json();

    if (data.success) {
        document.getElementById('orderId').textContent = `#${data.order_id}`;
        document.getElementById('orderAmount').textContent = `₹${data.total.toLocaleString('en-IN')}`;
        document.getElementById('successModal').style.display = 'flex';
        updateCartBadge();
    } else {
        showToast(data.error || 'Payment failed. Please try again.');
    }
}

loadOrderSummary();
</script>
<style>
@keyframes zoomIn { from { transform:scale(0.8); opacity:0; } to { transform:scale(1); opacity:1; } }
.payment-container select { width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:14px;margin-top:6px; }
.payment-container label { display:block;margin-top:12px;font-size:13px;font-weight:600;color:#444; }
</style>
{% endblock %}
